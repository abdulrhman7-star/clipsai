# fly.toml app configuration file generated for clipsai on 2026-08-07T20:07:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clipsai'
primary_region = 'iad'

[deploy]
  strategy = 'rolling'
  wait_timeout = '600m'

[http_service]
  auto_start_machines = true
  auto_stop_machines = true
  force_https = true
  internal_port = 8080
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '1gb'
  memory_mb = 1024
